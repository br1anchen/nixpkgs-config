# .agents/kitchen.toml: which of this repo's own commands prove which part of it.
# Read by pstack-kitchen's kitchen.py (github:br1anchen/open-pstack); schema in
# its skills/pstack-kitchen/references/kitchen-toml.md.
version = 1

# Home Manager: both profiles must evaluate (AGENTS.md#testing-guidelines).
[profile.home]
paths = [
  "flake.nix",
  "flake.lock",
  "shell.nix",
  "config.nix",
  "home-manager/**",
  "modules/**",
  "overlay/**",
  "pkgs/**",
  "dotfiles/**",
  "config/agents/**",
  "config/bob/**",
  "config/chromium/**",
  "config/codex/**",
  "config/czrc",
  "config/gemini/**",
  "config/ghostty/**",
  "config/git/**",
  "config/herdr/**",
  "config/jj/**",
  "config/lazygit/**",
  "config/lazyvim",
  "config/mise/**",
  "config/opencode/**",
  "config/tmux/**",
  "config/nix-temp-gc.sh",
  "config/starship.toml",
  "scripts/dotfiles-sync.sh",
  "scripts/omarchy-bootstrap.sh",
  "fix_macos_updated.sh",
  ".envrc",
  ".gitmodules",
]
fast = [
  "nix eval --raw .#homeConfigurations.omarchy.activationPackage.drvPath",
  "nix eval --raw .#homeConfigurations.darwin.activationPackage.drvPath",
]
landing = [
  "nix flake check",
  "home-manager build --flake .#omarchy",
]
verify = "gates"
heavy = true

[escalate]
paths = ["flake.nix", ".agents/kitchen.toml"]
manifests = ["flake.lock"]
max_diff_lines = 600

[[policy.forbid]]
id = "literal-secret"
pattern = '''(?i)(api[_-]?key|secret|token|password)\s*[:=]\s*["'][A-Za-z0-9_\-]{20,}["']'''
paths = ["**"]
message = "keep secrets out of the repo; read them from host environment or a secret manager"
source = "AGENTS.md#security--configuration-tips"

[review]
standards = ["AGENTS.md#coding-style--naming-conventions", "AGENTS.md#testing-guidelines"]

[landing]
mode = "commit"

[coverage]
ignore = [
  ".agents/**",
  "docs/**",
  "README.md",
  "AGENTS.md",
  "GEMINI.md",
  ".gitignore",
  "cz.config.js",
]

[resources]
max_parallel_heavy = 1
