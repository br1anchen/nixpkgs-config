# Shared runtime versions. mise owns language runtimes on both platforms because
# Omarchy's `mise activate bash` PREPENDS its shim dir, so a nix-installed `go`
# or `node` is unreachable on Linux regardless of profile order.
#
# The agent entries below are Omarchy's (installed by
# /usr/share/omarchy/install/user/mise.sh and refreshed by `omarchy update`).
# They MUST stay: this file replaces ~/.config/mise/config.toml wholesale, and
# dropping them silently uninstalls Omarchy's agent tooling.
[tools]
# Omarchy-managed agent tooling
claude = "latest"
codex = "latest"
gh = "latest"
# pi is mise-managed rather than a nix package: Omarchy's installer runs
# `omarchy-mise-install pi`, and mise's install dirs sit AHEAD of
# ~/.nix-profile/bin on PATH, so a nix-pinned pi would be silently shadowed.
pi = "latest"

# Language runtimes
node = "26.8.1"
go = "1.23.4"
python = "3.12.10"
yarn = "1.22.18"
pnpm = "11.22.0"
bun = "1.3.14"
deno = "1.46.2"
zig = "0.13.0"
uv = "0.11.20"
opencode = "latest"

# Commit CLI, driven by lazygit's `git czg` custom command (config/lazygit/config.yml).
# mise-managed rather than `npm i -g`: an npm global lands in ONE node install's
# bin dir, so every bump of `node` above silently orphans it and the git-czg shim
# dies with "No version is set for shim: git-czg".
"npm:czg" = "latest"

# Release/source-map upload CLI. The aqua entry is a native binary, so unlike the
# previous `npm i -g @sentry/cli` it does not ride on a node install either.
sentry-cli = "latest"

# Devin publishes native bundles outside mise's registry. The devin-upgrade task
# locks manifest checksums before installing; the marker disables self-updates.
[tools."http:devin"]
version = "latest"
version_list_url = "https://static.devin.ai/cli/current/manifest.json"
version_json_path = ".version"
checksum_url = "https://static.devin.ai/cli/{{ version }}/manifest.json"
checksum_expr = '"sha256:" + filter(values(fromJSON(body).platforms), { #.url == url })[0].sha256'
bin_path = "bin"
postinstall = 'echo mise > "$MISE_TOOL_INSTALL_PATH/distribution"'

[tools."http:devin".platforms]
macos-arm64 = { url = "https://static.devin.ai/cli/{{ version }}/devin-{{ version }}-aarch64-apple-darwin.tar.gz" }
macos-x64 = { url = "https://static.devin.ai/cli/{{ version }}/devin-{{ version }}-x86_64-apple-darwin.tar.gz" }
linux-arm64 = { url = "https://static.devin.ai/cli/{{ version }}/devin-{{ version }}-aarch64-unknown-linux.tar.gz" }
linux-x64 = { url = "https://static.devin.ai/cli/{{ version }}/devin-{{ version }}-x86_64-unknown-linux.tar.gz" }

[tasks.devin-upgrade]
description = "Install or upgrade Devin CLI with upstream checksum verification"
run = [
  "mise lock --global --bump --platform linux-x64,linux-arm64,macos-x64,macos-arm64 http:devin",
  "mise install http:devin",
]

[settings]
idiomatic_version_file_enable_tools = []

[settings.upgrade]
auto_prune = false
